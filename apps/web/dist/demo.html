<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TyreMind — auto demo</title>
<style>
/* ---------------------------------------------------------------------------
   Self-driving demo.

   Loads the real application in a same-origin frame and drives it on a fixed
   timeline while captioning what it is doing. Nothing here is a mock-up: every
   number on screen is computed by the running estimator.

   Total runtime is exactly 4:55 at the default speed. The timeline is authored
   in "natural" seconds and divided by ?speed, so ?speed=1 gives the leisurely
   6:23 version for anyone who would rather speed it up in an editor.
--------------------------------------------------------------------------- */
:root {
  --ground:#0e1418; --ink:#e4eaed; --ink-2:#8fa3ae; --ink-3:#5d6f7a;
  --tyre:#ff8a5b; --line:#26343d;
  --sans:'Archivo',ui-sans-serif,system-ui,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ground);color:var(--ink);font-family:var(--sans);overflow:hidden}

/* Explicit width AND height. An iframe carries an intrinsic height attribute
   of 150px, and the `inset` shorthand does not override it -- the app then
   renders into a 150px sliver and collapses its own responsive layout. */
#app{position:fixed;top:0;left:0;display:block;border:0;background:var(--ground);
     width:100vw;height:calc(100vh - 132px)}

/* Caption dock ------------------------------------------------------------- */
#dock{position:fixed;left:0;right:0;bottom:0;height:132px;background:#0a0f12;
      border-top:1px solid var(--line);padding:16px 34px 0;display:flex;flex-direction:column}
#action{font-family:var(--mono);font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;
        color:var(--tyre);height:16px;white-space:nowrap;overflow:hidden}
#caption{font-size:29px;line-height:1.24;font-weight:600;letter-spacing:-.011em;
         margin-top:9px;max-width:1600px;text-wrap:balance}
#caption b{color:var(--tyre)}
#caption .cool{color:#4fa8c5}

#meter{position:fixed;left:0;right:0;bottom:0;height:4px;background:#162026}
#bar{height:100%;width:0;background:var(--tyre);transition:width .25s linear}
#clock{position:fixed;right:30px;bottom:100px;font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}

/* Start gate --------------------------------------------------------------- */
#gate{position:fixed;inset:0;background:var(--ground);display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:22px;z-index:20;text-align:center}
#gate h1{font-size:58px;font-weight:700;letter-spacing:.02em}
#gate h1 span{color:var(--tyre)}
#gate p{color:var(--ink-2);font-size:16px;max-width:640px;line-height:1.55}
#gate kbd{font-family:var(--mono);background:#1d272e;border:1px solid var(--line);
          border-radius:3px;padding:2px 8px;font-size:14px;color:var(--ink)}
#count{font-family:var(--mono);font-size:150px;line-height:1;color:var(--tyre);height:150px}
#ready{font-family:var(--mono);font-size:14px;color:var(--ink-3);height:20px}
#ready.go{color:#4bbf8a}
.hidden{display:none!important}
</style>
</head>
<body>

<iframe id="app" src="/" title="TyreMind"></iframe>

<div id="dock">
  <div id="action"></div>
  <div id="caption"></div>
</div>
<div id="clock">0:00 / 4:55</div>
<div id="meter"><div id="bar"></div></div>

<div id="gate">
  <h1>TYRE<span>MIND</span></h1>
  <p>Self-driving demo. Runs for exactly <strong>4:55</strong> and captions itself.<br>
     Start your screen recorder, then press <kbd>Space</kbd>.</p>
  <div id="ready">Preparing the session…</div>
  <div id="count"></div>
  <p style="font-size:13.5px;color:var(--ink-3)">
     <kbd>Space</kbd> start / pause &nbsp;·&nbsp; <kbd>R</kbd> restart &nbsp;·&nbsp; <kbd>F11</kbd> fullscreen first
  </p>
</div>

<script>
const SPEED = parseFloat(new URLSearchParams(location.search).get('speed') || '1.3');
const frame  = document.getElementById('app');
const elAct  = document.getElementById('action');
const elCap  = document.getElementById('caption');
const elBar  = document.getElementById('bar');
const elClock= document.getElementById('clock');
const gate   = document.getElementById('gate');
const count  = document.getElementById('count');

const doc = () => frame.contentDocument;
const win = () => frame.contentWindow;

/* Drive helpers. Each is defensive: a missing control skips rather than
   derailing the timeline, because one late-rendering chart should not cost
   the remaining four minutes. */
function go(hash) { try { win().location.hash = hash; } catch (e) {} }

function scrollTo(px) {
  try {
    const m = doc().querySelector('main');
    if (m) m.scrollTo({ top: px, behavior: 'smooth' });
  } catch (e) {}
}

function clickText(text) {
  try {
    const b = [...doc().querySelectorAll('button')]
      .find(x => x.textContent.trim().toLowerCase().startsWith(text.toLowerCase()));
    if (b) b.click();
  } catch (e) {}
}

/* Timeline. `at` is in natural seconds; SPEED compresses it. --------------- */
const SCRIPT = [
  { at:   0, act:'Start here · Monza 2024 · race',        cap:'A real Formula 1 race. Monza, 2024. <b>921 laps</b>, 20 cars.', do:()=>{ go('#/overview'); scrollTo(0); } },
  { at:   8, act:'The standard method',                    cap:'Fit a line through lap time against tyre age — what everyone does.' },
  { at:  17, act:'Reading the result',                     cap:'It says the tyres got <b>faster</b> the longer they ran.' },
  { at:  26, act:'Both compounds',                         cap:'<b>−0.004</b> s/lap on the hard. <b>−0.034</b> on the medium. Both impossible.' },
  { at:  35, act:'What TyreMind reports',                  cap:'Same laps, separated properly: <b>+0.074</b> and <b>+0.113</b> s/lap — each with an interval.', do:()=>scrollTo(430) },
  { at:  46, act:'Why is the car slow · peel the causes',  cap:'So where did the lap time actually go?', do:()=>{ go('#/explain'); scrollTo(0); } },
  { at:  55, act:'Stage 1 — raw lap times',                cap:'One stint. Ricciardo, 41 laps on the hard. Grey is what the stopwatch saw.', do:()=>clickText('Lap times as driven') },
  { at:  68, act:'Stage 2 — fuel removed',                 cap:'Take out fuel burn-off. The car sheds 2.7 kg a lap and gains <span class="cool">0.08 s/lap</span>.', do:()=>clickText('Fuel burn-off removed') },
  { at:  81, act:'Stage 3 — track evolution removed',      cap:'Take out track evolution. Rubber goes down, the whole circuit speeds up.', do:()=>clickText('Track evolution removed') },
  { at:  93, act:'Stage 4 — traffic removed',              cap:'Take out traffic. What is left standing is the tyre.', do:()=>clickText('Traffic removed') },
  { at: 105, act:'The reveal',                             cap:'The tyre lost <b>2.15 s</b>. The car finished <b>1.78 s faster</b>. Fuel hid the wear entirely.' },
  { at: 117, act:'Lap-by-lap decomposition',               cap:'Every lap, split into causes. Orange is tyre loss, blue is fuel gain.', do:()=>scrollTo(760) },
  { at: 129, act:'Where the lines cross',                  cap:'They cross. That is the lap the stint stops getting faster and starts getting slower.' },
  { at: 141, act:'Does it work · the hard part',           cap:'So why does nobody check this?', do:()=>{ go('#/evidence'); scrollTo(0); } },
  { at: 150, act:'Three causes, one direction',            cap:'Fuel, track and tyre all move lap time smoothly with lap number.' },
  { at: 159, act:'The identification problem',             cap:'<b>Many wrong decompositions add up to the same right total.</b>' },
  { at: 169, act:'Why the standard metric is blind',       cap:'A model can predict lap times almost perfectly and blame the wrong cause.' },
  { at: 179, act:'The gap in the literature',              cap:'Every paper here is graded on lap-time error. That metric cannot see this failure.' },
  { at: 189, act:'Ground-truth recovery · 25 sessions',    cap:'So I built a ground truth: synthetic sessions with a wear rate I set myself.', do:()=>scrollTo(900) },
  { at: 201, act:'The headline result',                    cap:'Standard method misses by <b>0.0966</b> s/lap. TyreMind misses by <b>0.0044</b>.' },
  { at: 212, act:'95.5% error reduction',                  cap:'A <b>95.5%</b> reduction — and the true value falls inside the interval every time.' },
  { at: 223, act:'Practice → race · 5 events, 2024',       cap:'Then the real test. Friday practice scored against Sunday, no race data in the fit.', do:()=>scrollTo(1500) },
  { at: 235, act:'Out-of-distribution transfer',           cap:'<b>0.0518</b> against the naive <b>0.1166</b>. Half the error, genuinely out of distribution.' },
  { at: 246, act:'The bias we report',                     cap:'Points sit above the line — a systematic <b>+0.047</b> bias. Reported, not tuned away.' },
  { at: 257, act:'Live monitor · streaming replay',        cap:'And the same estimator runs live.', do:()=>{ go('#/live'); scrollTo(0); } },
  { at: 263, act:'Starting the replay',                    cap:'The real session, one lap at a time, with no access to anything that happens later.', do:()=>clickText('Start live replay') },
  { at: 276, act:'Per-car degradation, updating',          cap:'Every car, every lap, each estimate carrying its own uncertainty.' },
  { at: 288, act:'Confidence collapsing',                  cap:'Watch the interval collapse: <b>±0.200</b> → <b>±0.025</b> s/lap over about 23 laps.' },
  { at: 300, act:'Real-time cost',                         cap:'<b>0.22 ms</b> per lap. Flat in session length — lap 80 costs what lap 1 costs.' },
  { at: 311, act:'Where it wears · 3D racing line',        cap:'Where on the lap the tyre actually gets used up.', do:()=>{ go('#/circuit'); scrollTo(0); } },
  { at: 322, act:'Physics from GPS alone',                 cap:'Colour is tyre loading, computed from GPS. It recovers circuit rotation on <b>7 of 8</b> tracks.' },
  { at: 333, act:'Beyond racing · NASA C-MAPSS',           cap:'Strip the motorsport words away and this is not a tyre problem.', do:()=>{ go('#/beyond'); scrollTo(300); } },
  { at: 344, act:'Cross-domain validation',                cap:'Identical estimator, no tyre-specific code: jet engine remaining life, against real ground truth.' },
  { at: 354, act:'Does it work · the model ladder',        cap:'And where I lose. <b>LightGBM predicts lap times better than I do.</b>', do:()=>{ go('#/evidence'); scrollTo(2350); } },
  { at: 364, act:'Why it does not matter',                 cap:'It has no parameter meaning "degradation rate", and it cannot extrapolate.' },
  { at: 373, act:'TyreMind · causal tyre intelligence',    cap:'The hard part was never building a model. <b>It was building a test that could fail.</b>' },
  // Hold the closing line rather than blanking it: the last frame is what a
  // paused video shows, and a thumbnail of an empty caption bar says nothing.
  { at: 383.5, act:'TyreMind · causal tyre intelligence',
    cap:'The hard part was never building a model. <b>It was building a test that could fail.</b>', end:true },
];

const TOTAL = SCRIPT[SCRIPT.length - 1].at / SPEED;
let t0 = null, timer = null, paused = false, elapsed = 0, fired = new Set();

const mmss = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
elClock.textContent = `0:00 / ${mmss(TOTAL)}`;

/* setInterval against a wall-clock timestamp, not requestAnimationFrame.
   rAF is paused entirely while the tab is unfocused, so the timeline froze the
   moment you alt-tabbed to start a screen recorder. An interval keeps firing
   (throttled in the background, which is harmless) and elapsed time is read
   from performance.now(), so the schedule stays accurate either way. */
function tick() {
  if (paused) return;
  const now = performance.now();
  if (t0 === null) t0 = now;
  elapsed = (now - t0) / 1000;

  for (let i = 0; i < SCRIPT.length; i++) {
    const step = SCRIPT[i];
    if (elapsed >= step.at / SPEED && !fired.has(i)) {
      fired.add(i);
      elAct.textContent = step.act;
      elCap.innerHTML = step.cap;
      if (step.do) step.do();
      if (step.end) {
        elBar.style.width = '100%';
        elClock.textContent = `${mmss(TOTAL)} / ${mmss(TOTAL)}`;
        clearInterval(timer);
        return;
      }
    }
  }
  elBar.style.width = Math.min(100, (elapsed / TOTAL) * 100) + '%';
  elClock.textContent = `${mmss(elapsed)} / ${mmss(TOTAL)}`;
}

/* The framed app takes about twelve seconds to boot, fetch and render. Starting
   the timeline before that produced a first shot of a half-empty page, so the
   gate stays shut until the app's own navigation and panels exist. */
let appReady = false;
const elReady = document.getElementById('ready');

function frameReady() {
  try {
    const d0 = doc();
    return !!d0 && d0.querySelectorAll('nav button, nav a').length >= 15
               && !!d0.querySelector('main');
  } catch (e) { return false; }
}

const readyPoll = setInterval(() => {
  if (!frameReady()) return;
  clearInterval(readyPoll);
  // Pin the opening shot: Monza, the race, scrolled to the top.
  try {
    const b = [...doc().querySelectorAll('nav button, nav a')]
      .find(x => /monza/i.test(x.textContent) && /race/i.test(x.textContent));
    if (b) b.click();
  } catch (e) {}
  go('#/overview');
  setTimeout(() => {
    scrollTo(0);
    appReady = true;
    elReady.textContent = 'Ready — press Space';
    elReady.classList.add('go');
  }, 2500);
}, 400);

function start() {
  gate.classList.add('hidden');
  t0 = null; fired.clear(); paused = false;
  clearInterval(timer);
  timer = setInterval(tick, 100);
  tick();
}

function countdownThenStart() {
  let n = 3;
  count.textContent = n;
  const iv = setInterval(() => {
    n -= 1;
    if (n === 0) { clearInterval(iv); count.textContent = ''; start(); }
    else count.textContent = n;
  }, 1000);
}

addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!gate.classList.contains('hidden')) { if (appReady) countdownThenStart(); }
    else { paused = !paused; if (!paused) t0 = performance.now() - elapsed * 1000; }
  }
  if (e.key.toLowerCase() === 'r') location.reload();
});
</script>
</body>
</html>
